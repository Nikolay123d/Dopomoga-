<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Чат для українців у Празі</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    body {
      margin: 0;
      font-family: sans-serif;
      background: url('https://i.ibb.co/fbpjfnm/Prague.jpg') no-repeat center center fixed;
      background-size: cover;
      display: flex;
      flex-direction: column;
      height: 100vh;
      color: #fff;
    }
    header {
      padding: 1em;
      background: rgba(0, 0, 0, 0.6);
      text-align: center;
      font-weight: bold;
    }
    nav {
      display: flex;
      background: rgba(0, 0, 0, 0.7);
    }
    nav button {
      flex: 1;
      padding: 1em;
      background: transparent;
      border: none;
      color: white;
      font-weight: bold;
    }
    nav button.active {
      background: rgba(255, 255, 255, 0.2);
    }
    #content > section {
      display: none;
      flex: 1;
      overflow-y: auto;
      background: rgba(0, 0, 0, 0.5);
      padding: 1em;
    }
    #content > section.active {
      display: flex;
      flex-direction: column;
    }
    #messages {
      flex: 1;
      overflow-y: auto;
      padding-bottom: 1em;
    }
    .message {
      margin: 0.5em 0;
      padding: 0.7em;
      background: rgba(255, 255, 255, 0.2);
      border-radius: 10px;
    }
    .sent {
      align-self: flex-end;
      background: rgba(0, 128, 255, 0.3);
    }
    .input-area {
      display: flex;
      padding: 0.5em;
      gap: 0.3em;
      background: rgba(0, 0, 0, 0.7);
    }
    .input-area input[type="text"] {
      flex: 1;
      padding: 0.6em;
      border-radius: 20px;
      border: none;
    }
    .input-area button {
      border: none;
      background: #007bff;
      color: white;
      padding: 0.6em 1em;
      border-radius: 20px;
    }
    .input-area label {
      cursor: pointer;
      padding: 0.6em;
    }
    #profile-dropdown {
      position: absolute;
      top: 60px;
      right: 10px;
      background: rgba(0, 0, 0, 0.8);
      border-radius: 10px;
      display: none;
      flex-direction: column;
      padding: 1em;
    }
    #profile:hover + #profile-dropdown,
    #profile-dropdown:hover {
      display: flex;
    }
    #map {
      height: 100%;
    }
  </style>
</head>
<body>
  <header>Привіт! Це чат підтримки для українців у Празі 🇨🇿</header>
  <nav>
    <button id="tab-chat" class="active">Чат</button>
    <button id="tab-map">Карта</button>
    <button id="tab-info">Інформація</button>
  </nav>
  <div id="content">
    <section id="section-chat" class="active">
      <div id="messages"></div>
      <div class="input-area">
        <input type="text" id="message-input" placeholder="Ваше повідомлення..." />
        <label for="image-upload">📷</label>
        <input type="file" id="image-upload" accept="image/*" style="display:none" />
        <button id="send-message">Надіслати</button>
      </div>
    </section>
    <section id="section-map">
      <div id="map"></div>
    </section>
    <section id="section-info">
      <h2>Допомога українцям</h2>
      <ul>
        <li><a href="#">Притулки в Празі</a></li>
        <li><a href="#">Пункти гуманітарної допомоги</a></li>
        <li><a href="#">Консультації та підтримка</a></li>
        <!-- добавим еще при необходимости -->
      </ul>
    </section>
  </div>

  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-storage-compat.js"></script>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    // Firebase config
    const firebaseConfig = {
      apiKey: "AIzaSyDV2BslF-Ll37a1XO3GEfzNMXa7YsSXL1o",
      authDomain: "web-app-b4633.firebaseapp.com",
      databaseURL: "https://web-app-b4633-default-rtdb.europe-west1.firebasedatabase.app",
      projectId: "web-app-b4633",
      storageBucket: "web-app-b4633.appspot.com",
      messagingSenderId: "1041887915171",
      appId: "1:1041887915171:web:84d62eae54e9291b47a316",
      measurementId: "G-C65BPE81SJ"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    const auth = firebase.auth();
    const storage = firebase.storage();

    const messageInput = document.getElementById("message-input");
    const sendButton = document.getElementById("send-message");
    const imageUpload = document.getElementById("image-upload");
    const messagesDiv = document.getElementById("messages");

    let currentUser = null;

    function escape(str) {
      const div = document.createElement("div");
      div.textContent = str;
      return div.innerHTML;
    }

    function renderMessage(data) {
      const div = document.createElement("div");
      div.className = "message" + (data.uid === (currentUser?.uid || '') ? " sent" : "");
      div.innerHTML = `<strong>${escape(data.nick)}:</strong><br>${escape(data.text)}`;
      if (data.image) {
        div.innerHTML += `<br><img src="${data.image}" alt="image" style="max-width:100%;border-radius:10px;" />`;
      }
      messagesDiv.appendChild(div);
      messagesDiv.scrollTop = messagesDiv.scrollHeight;
    }

    function loadMessages() {
      db.ref("messages").limitToLast(100).on("child_added", (snapshot) => {
        renderMessage(snapshot.val());
      });
    }

    async function checkAndRegister() {
      if (!auth.currentUser) {
        const nick = prompt("Введіть ваше ім'я");
        const email = prompt("Email");
        const pass = prompt("Пароль");
        await auth.createUserWithEmailAndPassword(email, pass);
        await auth.currentUser.updateProfile({ displayName: nick });
      }
      currentUser = auth.currentUser;
    }

    sendButton.addEventListener("click", async () => {
      await checkAndRegister();

      const text = messageInput.value.trim();
      const file = imageUpload.files[0];
      if (!text && !file) return;

      let imageUrl = null;
      if (file) {
        const ref = storage.ref().child("images/" + Date.now());
        await ref.put(file);
        imageUrl = await ref.getDownloadURL();
      }

      const message = {
        uid: currentUser.uid,
        nick: currentUser.displayName,
        text,
        image: imageUrl,
        timestamp: Date.now()
      };
      db.ref("messages").push(message);
      messageInput.value = "";
      imageUpload.value = "";
    });

    // вкладки
    document.getElementById("tab-chat").addEventListener("click", () => {
      setTab("chat");
    });
    document.getElementById("tab-map").addEventListener("click", () => {
      setTab("map");
      if (!window.map) initMap();
    });
    document.getElementById("tab-info").addEventListener("click", () => {
      setTab("info");
    });

    function setTab(tab) {
      document.querySelectorAll("nav button").forEach(btn => btn.classList.remove("active"));
      document.querySelectorAll("#content > section").forEach(sec => sec.classList.remove("active"));
      document.getElementById(`tab-${tab}`).classList.add("active");
      document.getElementById(`section-${tab}`).classList.add("active");
    }

    function initMap() {
      const map = L.map("map").setView([50.0755, 14.4378], 13);
      L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
        attribution: "© OpenStreetMap contributors"
      }).addTo(map);

      for (let i = 0; i < 15; i++) {
        const lat = 50.07 + Math.random() * 0.03;
        const lng = 14.42 + Math.random() * 0.03;
        L.marker([lat, lng]).addTo(map).bindPopup("Пункт допомоги " + (i + 1));
      }

      window.map = map;
    }

    loadMessages();
  </script>
</body>
</html>
