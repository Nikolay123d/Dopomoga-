<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PrahaFushki – Pomoc Ukrajincům</title>
  <link rel="stylesheet" href="css/style.css">
  <script defer src="js/tabs.js"></script>
  <script defer src="js/map.js"></script>
  <script defer src="js/auth.js"></script>
  <script defer src="firebase/firebase-config.js"></script>
</head>
<body>
  <div class="tabs">
    <button class="tab-button active" onclick="openTab(event, 'chat')">💬 Чат</button>
    <button class="tab-button" onclick="openTab(event, 'map')">🗺 Карта</button>
    <button class="tab-button" onclick="openTab(event, 'help')">🚑 Помощь</button>
  </div>

  <div id="chat" class="tab-content active">
    <div class="chat-background">
      <img src="img/Prague.jpg" alt="Прага">
    </div>
    <div class="chat-container">
      <div class="chat-header">PrahaFushki</div>
      <div class="chat-messages" id="chatMessages"></div>
      <div class="chat-input">
        <img class="avatar" src="img/istockphoto-1495088043-612x612.jpg" alt="Avatar">
        <input type="text" id="messageInput" placeholder="Написать сообщение...">
        <button onclick="sendMessage()">Отправить</button>
      </div>
    </div>
  </div>

  <div id="map" class="tab-content">
    <div id="mapContainer"></div>
    <div class="map-buttons">
      <button onclick="filterMarkers('hospital')">🏥 Больницы</button>
      <button onclick="filterMarkers('lawyer')">⚖️ Юристы</button>
      <button onclick="filterMarkers('store')">🛒 Магазины</button>
    </div>
  </div>

  <div id="help" class="tab-content">
    <h2>Горячая помощь</h2>
    <ul class="help-list">
      <li><img src="img/palata-vchehii-jpg.webp" alt="Больница"> Больницы</li>
      <li><img src="img/images-5.jpg" alt="Юристы"> Юристы</li>
      <li><img src="img/images-6.jpg" alt="Магазины"> Магазины</li>
    </ul>
  </div>
</body>
</html>
