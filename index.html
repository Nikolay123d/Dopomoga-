<!DOCTYPE html><html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pomocná Mapa Prahy</title>
  <script type="module">
    // Firebase initialization
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getDatabase, ref, push, onChildAdded } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";const firebaseConfig = {
  apiKey: "AIzaSyDV2BslF-Ll37a1XO3GEfzNMXa7YsSXL1o",
  authDomain: "web-app-b4633.firebaseapp.com",
  databaseURL: "https://web-app-b4633-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "web-app-b4633",
  storageBucket: "web-app-b4633.firebasestorage.app",
  messagingSenderId: "1041887915171",
  appId: "1:1041887915171:web:84d62eae54e9291b47a316",
  measurementId: "G-C65BPE81SJ"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);
const chatRef = ref(db, "chat");

let nickname = '';

document.addEventListener('DOMContentLoaded', () => {
  const regForm = document.getElementById('regForm');
  const registrationForm = document.getElementById('registration-form');
  const messagesDiv = document.getElementById('messages');
  const messageInput = document.getElementById('message-input');
  const sendButton = document.getElementById('send-button');
  const imageInput = document.getElementById('image-input');

  regForm.addEventListener('submit', (e) => {
    e.preventDefault();
    nickname = document.getElementById('nick').value || ('Uživatel' + Math.floor(Math.random() * 10000));
    registrationForm.style.display = 'none';
  });

  sendButton.addEventListener('click', () => {
    const msg = messageInput.value;
    if (msg.trim() !== '') {
      push(chatRef, { user: nickname, text: msg });
      messageInput.value = '';
    }
  });

  imageInput.addEventListener('change', function () {
    const file = imageInput.files[0];
    if (file) {
      const reader = new FileReader();
      reader.onload = function (e) {
        push(chatRef, { user: nickname, image: e.target.result });
      };
      reader.readAsDataURL(file);
    }
  });

  onChildAdded(chatRef, (data) => {
    const val = data.val();
    const item = document.createElement('p');
    item.innerHTML = `<strong>${val.user}:</strong> ${val.text || ''}`;
    if (val.image) {
      const img = document.createElement('img');
      img.src = val.image;
      img.style.width = '100px';
      item.appendChild(document.createElement('br'));
      item.appendChild(img);
    }
    messagesDiv.appendChild(item);
    messagesDiv.scrollTop = messagesDiv.scrollHeight;
  });
});

  </script>
  <script src="https://maps.googleapis.com/maps/api/js?key=YOUR_GOOGLE_MAPS_API_KEY"></script>
  <style>
    body, html {
      margin: 0;
      padding: 0;
      height: 100%;
      font-family: Arial, sans-serif;
    }
    #chat-container {
      background: url('https://i.ibb.co/fbpjfnm/Prague.jpg') no-repeat center center fixed;
      background-size: cover;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      height: 100vh;
      padding: 10px;
      box-sizing: border-box;
      color: white;
    }
    #messages {
      flex: 1;
      overflow-y: auto;
      margin-bottom: 10px;
      padding: 10px;
      background: rgba(0, 0, 0, 0.4);
      border-radius: 10px;
    }
    #input-container {
      display: flex;
      align-items: center;
      background: rgba(255, 255, 255, 0.9);
      padding: 5px;
      border-radius: 10px;
    }
    #message-input {
      flex: 1;
      padding: 10px;
      border: none;
      border-radius: 10px;
      margin-right: 5px;
    }
    #send-button, #image-upload-button {
      background: #007bff;
      color: white;
      border: none;
      border-radius: 10px;
      padding: 10px;
      cursor: pointer;
      margin-left: 5px;
    }
    #registration-form {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.8);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }
    #registration-form form {
      background: white;
      padding: 20px;
      border-radius: 10px;
      color: black;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    #map {
      height: 100vh;
      display: none;
    }
    #buttons {
      position: absolute;
      top: 10px;
      right: 10px;
      z-index: 1001;
    }
    #buttons button {
      margin-left: 5px;
      padding: 10px;
      background: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div id="registration-form">
    <form id="regForm">
      <label>Nick:</label>
      <input type="text" id="nick" required>
      <label>Email:</label>
      <input type="email" id="email" required>
      <label>Password:</label>
      <input type="password" id="password" required>
      <button type="submit">Zaregistrovat</button>
    </form>
  </div>  <div id="chat-container">
    <div id="buttons">
      <button onclick="showChat()">Chat</button>
      <button onclick="showMap()">Mapa</button>
    </div>
    <div id="messages"></div>
    <div id="input-container">
      <input type="text" id="message-input" placeholder="Zpráva...">
      <button id="image-upload-button" onclick="document.getElementById('image-input').click()">📷</button>
      <input type="file" id="image-input" style="display:none" accept="image/*">
      <button id="send-button">Odeslat</button>
    </div>
  </div>  <div id="map"></div>  <script>
    function showChat() {
      document.getElementById('map').style.display = 'none';
      document.getElementById('chat-container').style.display = 'flex';
    }

    function showMap() {
      document.getElementById('chat-container').style.display = 'none';
      document.getElementById('map').style.display = 'block';
      initMap();
    }

    function initMap() {
      const prague = { lat: 50.0755, lng: 14.4378 };
      const map = new google.maps.Map(document.getElementById("map"), {
        zoom: 12,
        center: prague,
        styles: [],
      });
      const categories = [
        { title: 'Mediální pomoc', position: { lat: 50.080, lng: 14.43 } },
        { title: 'Právníci', position: { lat: 50.09, lng: 14.44 } },
        { title: 'Volunteři', position: { lat: 50.07, lng: 14.45 } },
        { title: 'Pomoc', position: { lat: 50.08, lng: 14.42 } }
      ];
      categories.forEach(cat => {
        new google.maps.Marker({ position: cat.position, map, title: cat.title });
      });
    }
  </script></body>
</html>
