<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Допомога | Прага</title>
  <link rel="stylesheet" href="css/style.css" />

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/10.5.2/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.5.2/firebase-auth.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.5.2/firebase-database.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.5.2/firebase-storage.js"></script>
</head>
<body>
  <header>
    <div class="user-info">
      <img id="userPhoto" src="img/default-avatar.png" alt="Аватар">
      <span id="username">Гість</span>
    </div>
  </header>

  <main>
    <section id="tabs">
      <button data-tab="chat">💬 Чат</button>
      <button data-tab="map">🗺 Карта</button>
      <button data-tab="info">ℹ️ Інформація</button>
    </section>

    <section id="chat" class="tab active">
      <div id="messages"></div>
      <form id="messageForm">
        <input type="text" id="messageInput" placeholder="Написати повідомлення..." required />
        <input type="file" id="imageInput" accept="image/*" />
        <button type="submit">📨</button>
      </form>
    </section>

    <section id="map" class="tab">
      <div id="mapContainer"></div>
    </section>

    <section id="info" class="tab">
      <h2>Як користуватись</h2>
      <p>Цей сервіс допоможе вам знайти волонтерів, аптеку, магазин або лікарню на карті Праги.</p>
    </section>
  </main>

  <!-- Модальне вікно -->
  <div id="authModal" class="modal hidden">
    <div class="modal-content">
      <h2>Авторизація</h2>
      <input type="text" id="nicknameInput" placeholder="Ваш нікнейм" required />
      <button id="loginBtn">Увійти</button>
    </div>
  </div>

  <script type="module" src="firebase/firebase-config.js"></script>
  <script src="js/app.js" defer></script>
</body>
</html>
