<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Прага-Фушки</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
  <style>
    html, body { margin: 0; height: 100%; font-family: sans-serif; }
    .tabs { display: flex; background: gold; justify-content: center; gap: 1rem; padding: 0.5rem; }
    .tabs button { background: none; border: none; font-weight: bold; padding: 10px 20px; cursor: pointer; }
    .tabs button.active { border-bottom: 3px solid black; }

    .tab-content { display: none; height: calc(100vh - 48px); }
    .tab-content.active { display: flex; flex-direction: column; }

    #chat { background: url('https://upload.wikimedia.org/wikipedia/commons/thumb/a/a7/Praha_-_Panorama.jpg/1280px-Praha_-_Panorama.jpg') center/cover no-repeat; position: relative; color: white; }
    #chat .overlay { position: absolute; inset: 0; background: rgba(0,0,0,0.4); }
    #chat-content { position: relative; z-index: 2; padding: 10px; flex-grow: 1; display: flex; flex-direction: column; }
    #messages { flex-grow: 1; overflow-y: auto; background: rgba(0,0,0,0.3); padding: 10px; border-radius: 10px; }
    .message { margin: 6px 0; padding: 10px; border-radius: 12px; max-width: 70%; word-wrap: break-word; }
    .sent { align-self: flex-end; background: gold; color: black; }
    .received { align-self: flex-start; background: #444; color: white; }
    .message img { max-width: 150px; border-radius: 8px; margin-top: 5px; }
    #chat-input-container { display: flex; gap: 8px; margin-top: 10px; }
    #text-input { flex: 1; padding: 10px; border-radius: 20px; border: none; }
    #send-btn, #btn-photo { padding: 10px 20px; border-radius: 20px; border: none; background: gold; cursor: pointer; }
    #register-modal { position: fixed; inset: 0; background: rgba(0,0,0,0.6); display: flex; align-items: center; justify-content: center; }
    #register-form { background: white; padding: 20px; border-radius: 15px; display: flex; flex-direction: column; gap: 10px; }
    #map { flex: 1; }
    #info-content { flex: 1; overflow-y: auto; padding: 20px; background: #fff8dc; }

    @media(max-width: 600px) {
      #chat-input-container { flex-direction: column; }
      #send-btn, #text-input, #btn-photo { width: 100%; }
    }
  </style>
</head>
<body>
  <div class="tabs">
    <button class="tab-btn active" data-tab="chat">Чат</button>
    <button class="tab-btn" data-tab="map">Карта</button>
    <button class="tab-btn" data-tab="info">Інфо</button>
  </div>

  <div id="chat" class="tab-content active">
    <div class="overlay"></div>
    <div id="chat-content">
      <div id="messages"></div>
      <div id="chat-input-container">
        <input id="text-input" type="text" placeholder="Написати повідомлення..." />
        <input id="file-input" type="file" accept="image/*" style="display:none" />
        <button id="btn-photo">📷</button>
        <button id="send-btn">Надіслати</button>
      </div>
    </div>
  </div>

  <div id="map" class="tab-content"></div>

  <div id="info" class="tab-content">
    <div id="info-content">
      <h2>Допомога українцям у Празі</h2>
      <p>Чат та карта з корисними локаціями: волонтери, робота, лікарі, магазини, аптеки, OAMP, перекладачі.</p>
      <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/9/91/OAMP_budova.jpg/800px-OAMP_budova.jpg" alt="OAMP">
    </div>
  </div>

  <div id="register-modal">
    <form id="register-form">
      <h3>Реєстрація</h3>
      <input type="text" id="reg-nick" placeholder="Нікнейм" required />
      <input type="email" id="reg-email" placeholder="Email" required />
      <input type="password" id="reg-password" placeholder="Пароль" required />
      <button type="submit">Увійти</button>
    </form>
  </div>

  <script>
    // Firebase config
    firebase.initializeApp({
      apiKey: "AIzaSyDV2BslF-Ll37a1XO3GEfzNMXa7YsSXL1o",
      authDomain: "web-app-b4633.firebaseapp.com",
      databaseURL: "https://web-app-b4633-default-rtdb.europe-west1.firebasedatabase.app",
      projectId: "web-app-b4633",
      storageBucket: "web-app-b4633.appspot.com",
      messagingSenderId: "1041887915171",
      appId: "1:1041887915171:web:84d62eae54e9291b47a316"
    });

    const db = firebase.database();
    const auth = firebase.auth();
    let currentUser = null;

    // Tabs
    document.querySelectorAll(".tab-btn").forEach(btn => {
      btn.onclick = () => {
        document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
        document.querySelectorAll(".tab-content").forEach(c => c.classList.remove("active"));
        btn.classList.add("active");
        document.getElementById(btn.dataset.tab).classList.add("active");
        if (btn.dataset.tab === "map") setTimeout(() => map.invalidateSize(), 300);
      };
    });

    // Chat
    const messagesEl = document.getElementById("messages");
    const sendBtn = document.getElementById("send-btn");
    const textInput = document.getElementById("text-input");
    const fileInput = document.getElementById("file-input");
    const btnPhoto = document.getElementById("btn-photo");

    btnPhoto.onclick = () => fileInput.click();

    function escapeHTML(str) {
      return str.replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m]));
    }

    function addMessage(msg) {
      const div = document.createElement("div");
      div.className = "message " + (msg.uid === currentUser?.uid ? "sent" : "received");
      div.innerHTML = `<strong>${escapeHTML(msg.nick)}:</strong><br>${msg.text ? escapeHTML(msg.text) : ""}`;
      if (msg.image) div.innerHTML += `<br><img src="${msg.image}" />`;
      if (msg.uid === currentUser?.uid) {
        const del = document.createElement("button");
        del.textContent = "✖";
        del.style = "position:absolute;top:5px;right:10px;background:none;border:none;color:red;";
        del.onclick = () => { if (confirm("Видалити повідомлення?")) db.ref("messages/" + msg.id).remove(); };
        div.style.position = "relative"; div.appendChild(del);
      }
      messagesEl.appendChild(div);
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    db.ref("messages").on("child_added", snap => addMessage(snap.val()));
    db.ref("messages").on("child_removed", snap => {
      [...messagesEl.children].forEach(msg => {
        if (msg.innerHTML.includes(snap.val().text || "") && msg.innerHTML.includes(snap.val().nick)) msg.remove();
      });
    });

    sendBtn.onclick = () => {
      const text = textInput.value.trim();
      const file = fileInput.files[0];
      if (!currentUser || (!text && !file)) return;
      const msg = {
        id: Date.now().toString(),
        uid: currentUser.uid,
        nick: localStorage.getItem("nick") || "Анонім",
        timestamp: firebase.database.ServerValue.TIMESTAMP
      };
      if (text) msg.text = text;
      if (file) {
        const reader = new FileReader();
        reader.onload = () => { msg.image = reader.result; db.ref("messages/" + msg.id).set(msg); };
        reader.readAsDataURL(file);
      } else {
        db.ref("messages/" + msg.id).set(msg);
      }
      textInput.value = "";
      fileInput.value = "";
    };

    // Auth
    const regForm = document.getElementById("register-form");
    regForm.onsubmit = async e => {
      e.preventDefault();
      const email = document.getElementById("reg-email").value.trim();
      const pass = document.getElementById("reg-password").value.trim();
      const nick = document.getElementById("reg-nick").value.trim();
      if (!email || !pass || !nick) return alert("Заповніть усі поля");
      try {
        const cred = await auth.createUserWithEmailAndPassword(email, pass);
        currentUser = cred.user;
        localStorage.setItem("nick", nick);
        document.getElementById("register-modal").style.display = "none";
      } catch (e) {
        alert(e.message);
      }
    };

    auth.onAuthStateChanged(user => {
      if (user) {
        currentUser = user;
        document.getElementById("register-modal").style.display = "none";
      } else {
        document.getElementById("register-modal").style.display = "flex";
      }
    });

    // Map
    const map = L.map("map").setView([50.0755, 14.4378], 13);
    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
      attribution: '&copy; OpenStreetMap'
    }).addTo(map);

    const points = [
      [50.087,14.420],[50.075,14.445],[50.072,14.438],[50.078,14.427],[50.089,14.415],
      [50.080,14.400],[50.082,14.430],[50.076,14.450],[50.090,14.420],[50.084,14.410],
      [50.088,14.445],[50.081,14.435],[50.074,14.424],[50.079,14.418],[50.086,14.440],
      [50.091,14.448],[50.073,14.419],[50.085,14.437],[50.070,14.430],[50.082,14.422],
      [50.077,14.416]
    ];
    points.forEach((p, i) => L.marker(p).addTo(map).bindPopup(`Допомога #${i+1}`));
  </script>
</body>
</html>
