<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Чат допомоги | Прага</title>

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/10.5.2/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.5.2/firebase-auth.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.5.2/firebase-database.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.5.2/firebase-storage.js"></script>

  <style>
    body, html {
      margin: 0;
      padding: 0;
      font-family: 'Arial', sans-serif;
      height: 100%;
      background: url('https://i.ibb.co/ccnZpXvW/Prague.jpg') no-repeat center center fixed;
      background-size: cover;
    }

    .overlay {
      background: rgba(0, 0, 0, 0.6);
      position: absolute;
      width: 100%;
      height: 100%;
      top: 0; left: 0;
      z-index: 0;
    }

    .app {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      height: 100%;
      color: white;
    }

    .menu {
      display: flex;
      justify-content: space-around;
      padding: 10px;
      background: rgba(0, 0, 0, 0.7);
      border-bottom: 1px solid #444;
    }

    .menu button {
      background: none;
      color: white;
      border: none;
      font-size: 16px;
      cursor: pointer;
    }

    .section {
      display: none;
      flex: 1;
      overflow-y: auto;
      padding: 10px;
    }

    .section.active {
      display: block;
    }

    #chat {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    #messages {
      flex: 1;
      overflow-y: auto;
      margin-bottom: 10px;
    }

    .message {
      background: rgba(255, 255, 255, 0.1);
      padding: 8px 10px;
      border-radius: 10px;
      margin-bottom: 8px;
    }

    .message img {
      max-width: 100%;
      border-radius: 10px;
    }

    .input-area {
      display: flex;
      gap: 5px;
    }

    .input-area input[type="text"] {
      flex: 1;
      padding: 8px;
      border-radius: 10px;
      border: none;
    }

    .input-area button {
      background-color: #00aaff;
      border: none;
      color: white;
      padding: 8px 12px;
      border-radius: 10px;
      cursor: pointer;
    }

    .input-area .photo-btn {
      background: #555;
      font-size: 18px;
    }

    .profile-button {
      position: absolute;
      top: 10px;
      right: 10px;
      background: none;
      border: none;
      color: white;
      font-size: 20px;
      cursor: pointer;
    }

    #profileMenu {
      display: none;
      position: absolute;
      top: 50px;
      right: 10px;
      background: rgba(0, 0, 0, 0.85);
      padding: 10px;
      border-radius: 10px;
    }

    #profileMenu button {
      display: block;
      width: 100%;
      background: none;
      border: none;
      color: white;
      margin: 5px 0;
      text-align: left;
      cursor: pointer;
    }

    .modal {
      display: none;
      position: fixed;
      z-index: 999;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.8);
      justify-content: center;
      align-items: center;
    }

    .modal-content {
      background: #222;
      padding: 20px;
      border-radius: 10px;
      color: white;
      width: 90%;
      max-width: 400px;
    }

    .modal-content input {
      width: 100%;
      margin-bottom: 10px;
      padding: 8px;
      border-radius: 8px;
      border: none;
    }

    .modal-content button {
      width: 100%;
      padding: 10px;
      background: #00aaff;
      border: none;
      border-radius: 8px;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }
  </style>
</head>

<body>
  <div class="overlay"></div>

  <div class="app">
    <div class="menu">
      <button onclick="switchSection('chat')">Чат</button>
      <button onclick="switchSection('map')">Карта</button>
      <button onclick="switchSection('info')">Інформація</button>
    </div>

    <button class="profile-button" onclick="toggleProfileMenu()">☰</button>

    <div id="profileMenu">
      <button onclick="openProfile()">Мій профіль</button>
      <button onclick="uploadAvatar()">Завантажити фото</button>
      <button onclick="logout()">Вийти</button>
    </div>

    <div id="chat" class="section active">
      <div id="messages"></div>
      <div class="input-area">
        <button class="photo-btn" onclick="selectPhoto()">📷</button>
        <input type="text" id="messageInput" placeholder="Напишіть повідомлення...">
        <button onclick="sendMessage()">Надіслати</button>
      </div>
    </div>

    <div id="map" class="section">
      <p>🗺️ Тут буде карта з точками допомоги українцям.</p>
    </div>

    <div id="info" class="section">
      <p>ℹ️ Тут буде інформація, поради та корисні посилання.</p>
    </div>
  </div>

  <!-- Модальне вікно реєстрації -->
  <div id="registerModal" class="modal">
    <div class="modal-content">
      <h3>Реєстрація</h3>
      <input type="text" id="regName" placeholder="Нікнейм">
      <input type="email" id="regEmail" placeholder="Email">
      <input type="password" id="regPassword" placeholder="Пароль">
      <button onclick="registerUser()">Зареєструватися</button>
    </div>
  </div>￼Enter
  <script>
  // Firebase config
  const firebaseConfig = {
    apiKey: "AIzaSyDV2BslF-Ll37a1XO3GEfzNMXa7YsSXL1o",
    authDomain: "web-app-b4633.firebaseapp.com",
    databaseURL: "https://web-app-b4633-default-rtdb.europe-west1.firebasedatabase.app",
    projectId: "web-app-b4633",
    storageBucket: "web-app-b4633.appspot.com",
    messagingSenderId: "1041887915171",
    appId: "1:1041887915171:web:84d62eae54e9291b47a316",
    measurementId: "G-C65BPE81SJ"
  };
  firebase.initializeApp(firebaseConfig);

  const auth = firebase.auth();
  const db = firebase.database();
  const storage = firebase.storage();

  const messageInput = document.getElementById("messageInput");
  const messagesDiv = document.getElementById("messages");
  const registerModal = document.getElementById("registerModal");

  let photoFile = null;

  // UI: переключение вкладок
  function switchSection(id) {
    document.querySelectorAll(".section").forEach(el => el.classList.remove("active"));
    document.getElementById(id).classList.add("active");
  }

  function toggleProfileMenu() {
    const menu = document.getElementById("profileMenu");
    menu.style.display = menu.style.display === "block" ? "none" : "block";
  }

  function selectPhoto() {
    const input = document.createElement('input');
    input.type = 'file';
    input.accept = 'image/*';
    input.onchange = () => {
      photoFile = input.files[0];
    };
    input.click();
  }

  function checkAuthBeforeSend() {
    const user = auth.currentUser;
    if (!user) {
      registerModal.style.display = "flex";
      return false;
    }
    return true;
  }

  function registerUser() {
    const name = document.getElementById("regName").value;
    const email = document.getElementById("regEmail").value;
    const password = document.getElementById("regPassword").value;

    auth.createUserWithEmailAndPassword(email, password)
      .then(cred => {
        return cred.user.updateProfile({ displayName: name });
      })
      .then(() => {
        localStorage.setItem("userRegistered", "true");
        registerModal.style.display = "none";
      })
      .catch(err => alert(err.message));
  }

  function sendMessage() {
    if (!checkAuthBeforeSend()) return;

    const text = messageInput.value.trim();
    const user = auth.currentUser;

    if (!text && !photoFile) return;

    const msgData = {
      name: user.displayName || "Користувач",
      uid: user.uid,
      timestamp: Date.now(),
    };

    if (text) msgData.text = text;

    if (photoFile) {
      const photoRef = storage.ref(`messages/${user.uid}/${Date.now()}_${photoFile.name}`);
      photoRef.put(photoFile).then(snapshot => {
        snapshot.ref.getDownloadURL().then(url => {
          msgData.photo = url;
          db.ref("messages").push(msgData);
        });
      });
      photoFile = null;
    } else {
      db.ref("messages").push(msgData);
    }

    messageInput.value = "";
  }

  function renderMessage(data) {
    const div = document.createElement("div");
    div.className = "message";

    if (data.name) div.innerHTML += `<strong>${data.name}</strong><br>`;
    if (data.text) div.innerHTML += `<span>${data.text}</span><br>`;
    if (data.photo) div.innerHTML += `<img src="${data.photo}">`;

    messagesDiv.appendChild(div);
    messagesDiv.scrollTop = messagesDiv.scrollHeight;
  }

  function loadMessages() {
    db.ref("messages").limitToLast(50).on("child_added", snap => {
      renderMessage(snap.val());
    });
  }

  function uploadAvatar() {
    const input = document.createElement('input');
    input.type = 'file';
    input.accept = 'image/*';
    input.onchange = () => {
      const file = input.files[0];
      const user = auth.currentUser;
      if (!user) return alert("Увійдіть спочатку");
      const avatarRef = storage.ref(`avatars/${user.uid}.jpg`);
      avatarRef.put(file).then(() => {
        avatarRef.getDownloadURL().then(url => {
          user.updateProfile({ photoURL: url });
          alert("Аватар оновлено!");
        });
      });
    };
    input.click();
  }

  function logout() {
    auth.signOut().then(() => {
      location.reload();
    });
  }

  function openProfile() {
    const user = auth.currentUser;
    if (!user) return;

    alert(`Ваш профіль:\nІм'я: ${user.displayName}\nEmail: ${user.email}`);
  }

  window.onload = () => {
    if (localStorage.getItem("userRegistered")) {
      auth.onAuthStateChanged(user => {
        if (user) {
          loadMessages();
        }
      });
    }

    // Приветствие
    setTimeout(() => {
      const greetingShown = localStorage.getItem("greetingShown");
      if (!greetingShown) {
        renderMessage({ name: "Система", text: "👋 Вітаємо в чаті допомоги українцям у Празі!" });
        localStorage.setItem("greetingShown", "true");
      }
    }, 1000);
  };

  // Закрытие модального окна по клику вне формы
  window.onclick = function(event) {
    if (event.target === registerModal) {
      registerModal.style.display = "none";
    }
  };
</script>
</body>
</html>
