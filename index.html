<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Чат допомоги | Прага</title>
  <link rel="stylesheet" href="css/style.css" />

  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/10.5.2/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.5.2/firebase-auth.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.5.2/firebase-database.js"></script>
</head>
<body>

  <!-- Вкладки -->
  <div class="tabs">
    <button class="tab-btn active" data-tab="chat">💬 Чат</button>
    <button class="tab-btn" data-tab="map">🗺️ Карта</button>
    <button class="tab-btn" data-tab="info">ℹ️ Інфо</button>
  </div>

  <!-- Чат -->
  <div id="chat" class="tab-content active">
    <div id="messages" class="messages"></div>
    <div class="input-box">
      <input type="text" id="messageInput" placeholder="Введіть повідомлення..." />
      <button id="sendBtn">📨</button>
    </div>
  </div>

  <!-- Карта -->
  <div id="map" class="tab-content">
    <div id="map-container">Карта завантажується...</div>
  </div>

  <!-- Інфо -->
  <div id="info" class="tab-content">
    <p>Цей чат створений для допомоги українцям у Празі 💛💙</p>
  </div>

  <!-- Стили -->
<link rel="stylesheet" href="css/style.css">

<!-- Скрипты -->
<script src="firebase/firebase-config.js"></script>
<script src="js/auth.js"></script>
<script src="js/tabs.js"></script>
<script src="js/map.js"></script>
</body>
                            </html>
